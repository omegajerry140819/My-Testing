<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💖</title>
    <style>
        /* Romantic ဖြစ်သော နောက်ခံအရောင် */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            position: relative;
        }

        /* လွင့်ပျံနေသော အသည်းပုံများအတွက် Animation */
        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart-bg {
            position: absolute;
            bottom: -10vh;
            animation: floatUp 6s infinite ease-in;
            opacity: 0.6;
        }

        .heart-bg:nth-child(1) { left: 15%; animation-duration: 5s; animation-delay: 0s; font-size: 30px; }
        .heart-bg:nth-child(2) { left: 35%; animation-duration: 7s; animation-delay: 2s; font-size: 20px; }
        .heart-bg:nth-child(3) { left: 65%; animation-duration: 6s; animation-delay: 1s; font-size: 35px; }
        .heart-bg:nth-child(4) { left: 85%; animation-duration: 8s; animation-delay: 3s; font-size: 25px; }
        .heart-bg:nth-child(5) { left: 50%; animation-duration: 5.5s; animation-delay: 4s; font-size: 40px; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(20deg); opacity: 0; }
        }

        /* အလယ်က ဖန်သားပြင် ဒီဇိုင်း */
        .card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            z-index: 2;
            box-shadow: 0 15px 35px rgba(255, 154, 158, 0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 26px;
            color: #d81b60; /* ရင့်သော ပန်းရောင် */
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        p {
            font-size: 19px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: bold;
            color: #ad1457;
        }

        /* ခလုတ်များ */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }

        button {
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* ဖုန်းမခေါ်ဘူး ခလုတ် */
        #btn-no-call {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
        }

        #btn-no-call:active {
            transform: scale(0.95);
        }

        /* ဖုန်းခေါ်မယ် ခလုတ် (ပြေးမည့် ခလုတ်) */
        #btn-call {
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            color: white;
            transition: all 0.3s ease; 
        }

        /* အဖြေပေါ်မည့် စာမျက်နှာကို ဖျောက်ထားရန် */
        #result-card {
            display: none;
        }

        .emoji {
            font-size: 60px;
            margin-bottom: 10px;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- နောက်ခံ အသည်းပုံလေးများ -->
    <div class="floating-hearts">
        <div class="heart-bg">💕</div>
        <div class="heart-bg">💖</div>
        <div class="heart-bg">💓</div>
        <div class="heart-bg">💗</div>
        <div class="heart-bg">💘</div>
    </div>

    <!-- ပထမဆုံး ပေါ်မည့် အမေး စာမျက်နှာ -->
    <div class="card" id="main-card">
        <h2>🎮 အထူးအခွင့်အရေး!</h2>
        <p>မောင့်ကိုဒီတစ်ညတော့ ချစ်လွန်းလို့ Game ပေးဆော့လိုက်မယ်</p>
        <div class="btn-container">
            <button id="btn-no-call">ဖုန်းမခေါ်ဘူး</button>
            <button id="btn-call">ဖုန်းခေါ်မယ်</button>
        </div>
    </div>

    <!-- ဖုန်းမခေါ်ဘူး နှိပ်လိုက်မှ ပေါ်လာမည့် စာမျက်နှာ -->
    <div class="card" id="result-card">
        <div class="emoji">👩‍❤️‍👨</div>
        <h2>Aww...</h2>
        <p>အဲ့တာလေးတွေကြောင့် မမ ကအချစ်တုံးလေးဖြစ်နေရတာ သိရဲ့လား 🥰</p>
    </div>

    <script>
        const btnCall = document.getElementById('btn-call');
        const btnNoCall = document.getElementById('btn-no-call');
        const mainCard = document.getElementById('main-card');
        const resultCard = document.getElementById('result-card');

        // ဖုန်းခေါ်မယ် ခလုတ်ကို နေရာရွှေ့မည့် Function
        function moveButton() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // ခလုတ်ကို ကျပန်းနေရာသို့ ပို့ဆောင်ရန် တွက်ချက်ခြင်း (ခလုတ်အရွယ်အစားကို ဖယ်ထားသည်)
            const randomX = Math.floor(Math.random() * (windowWidth - 120));
            const randomY = Math.floor(Math.random() * (windowHeight - 60));

            btnCall.style.position = 'fixed';
            btnCall.style.left = randomX + 'px';
            btnCall.style.top = randomY + 'px';
        }

        // ကွန်ပျူတာ (Mouse တင်လိုက်သည်နှင့် ပြေးရန်)
        btnCall.addEventListener('mouseover', moveButton);
        
        // ဖုန်း (ထိလိုက်သည်နှင့် ပြေးရန်)
        btnCall.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveButton();
        });

        // ဖုန်းမခေါ်ဘူး ခလုတ် နှိပ်လိုက်လျှင် ချစ်စရာစာသား ပေါ်လာရန်
        btnNoCall.addEventListener('click', () => {
            mainCard.style.display = 'none';
            resultCard.style.display = 'block';
        });
    </script>

</body>
</html>
